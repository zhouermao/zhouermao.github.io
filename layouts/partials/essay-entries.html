{{ range . }}
  <article class="essay-entry">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ with .Params.summary }}
      <p>{{ . | markdownify }}</p>
    {{ end }}
    <p class="single-date">
      发布于
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
      {{ if gt .Lastmod .Date }}
        · 更新于
        <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "2006.01.02" }}</time>
      {{ end }}
    </p>
  </article>
{{ else }}
  <p>还没有文章。</p>
{{ end }}
